<!doctype html><html lang="en"><meta name="viewport" content="width=device-width"><title>Camera asset finder</title>
<style>body{font:16px system-ui;max-width:850px;margin:auto;padding:20px;background:#f5f7fb}main{background:#fff;padding:18px;border-radius:14px}video,canvas{width:100%;max-height:60vh;background:#111;border-radius:10px}button,input{font:inherit;padding:10px;margin:8px 0;width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}pre{white-space:pre-wrap;background:#101827;color:#dbe8ff;padding:12px;border-radius:8px}@media(max-width:520px){.row{grid-template-columns:1fr}}</style>
<main><h1>Find an asset</h1><p>Point the camera squarely at a screen, print, poster, or artwork. Avoid glare and fill most of the frame.</p><video id="v" playsinline autoplay muted></video><canvas id="c" hidden></canvas><div class="row"><button id="start">Start camera</button><button id="snap">Capture and identify</button></div><label>Or upload a screenshot/crop/photo<input id="file" type="file" accept="image/*" capture="environment"></label><pre id="out" aria-live="polite">Ready.</pre></main>
<script>const v=document.querySelector('#v'),c=document.querySelector('#c'),out=document.querySelector('#out');let stream;async function send(blob,name='capture.jpg'){out.textContent='Analyzing...';const fd=new FormData();fd.set('file',blob,name);let j;try{const r=await fetch('/api/visual-identify',{method:'POST',body:fd});j=await r.json().catch(()=>({error:'Unexpected response ('+r.status+')'}));if(r.status===503)j={error:'Visual recognition is not enabled on this deployment yet.'}}catch(e){j={error:'Network error: '+e.message}}out.textContent=JSON.stringify(j,null,2);if(j.verificationUrl&&j.matched)location.href=j.verificationUrl}document.querySelector('#start').onclick=async()=>{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=stream};document.querySelector('#snap').onclick=()=>{if(!v.videoWidth)return out.textContent='Start the camera first.';c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(b=>b&&send(b),'image/jpeg',.92)};document.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(f)send(f,f.name)};</script></html>
