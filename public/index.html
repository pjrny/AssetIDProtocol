<!doctype html><html lang="en"><meta name="viewport" content="width=device-width"><title>Asset Passport Demo</title>
<style>body{font:16px system-ui;max-width:900px;margin:auto;padding:24px;background:#f5f7fb;color:#172033}section{background:white;padding:20px;margin:16px 0;border-radius:14px;box-shadow:0 4px 22px #0001}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:9px;width:100%;box-sizing:border-box}button{cursor:pointer;background:#3157d5;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101827;color:#d9e7ff;padding:14px;border-radius:8px}</style>
<h1>Asset Passport Demo</h1><p>Register an image, assign rights, then identify an exact copy or a decoded watermark ID.</p>
<section><h2>Register</h2><form id="reg"><label>Image<input name="file" type="file" accept="image/*" required></label><label>Title<input name="title" required></label><label>Creator<input name="creator" required></label><label>Email<input name="email" type="email"></label><label>Webhook URL<input name="webhookUrl" type="url"></label><label>License<select name="licenseCode"><option value="ARR">All rights reserved</option><option value="CC-BY-4.0">CC BY 4.0</option><option value="COMMERCIAL">Commercial license</option></select></label><label>Maximum downloads<input name="maxDownloads" type="number" min="0"></label><label>Expiry<input name="expiresAt" type="datetime-local"></label><button>Register</button></form></section>
<section><h2>Identify</h2><form id="find"><label>Exact file<input name="file" type="file" accept="image/*"></label><label>Or decoded watermark ID<input name="watermarkId"></label><button>Identify</button></form></section><pre id="out" aria-live="polite">Ready.</pre>
<script>const out=document.querySelector('#out');async function submit(e,path){e.preventDefault();out.textContent='Working...';try{const r=await fetch(path,{method:'POST',body:new FormData(e.target)});const j=await r.json();out.textContent=JSON.stringify(j,null,2);if(j.verificationUrl)out.textContent+='\n\nOpen: '+j.verificationUrl}catch(x){out.textContent=String(x)}}document.querySelector('#reg').addEventListener('submit',e=>submit(e,'/api/assets'));document.querySelector('#find').addEventListener('submit',e=>submit(e,'/api/identify'));</script></html>
